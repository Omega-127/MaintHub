services:

  # ─────────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mainthub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mainthub_root
      MYSQL_DATABASE: mainthub_db
      MYSQL_USER: mainthub_user
      MYSQL_PASSWORD: mainthub_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmainthub_root"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # phpMyAdmin — visual database admin
  # Open: http://localhost:8080
  # ─────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mainthub-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: mainthub_user
      PMA_PASSWORD: mainthub_pass
    ports:
      - "8080:80"
    depends_on:
      - mysql

  # ─────────────────────────────────────────────
  # Flask Backend — uncomment when Dockerfile is ready
  # ─────────────────────────────────────────────
  # backend:
  #   build:
  #     context: ./mainthub-backend
  #     dockerfile: Dockerfile
  #   container_name: mainthub-backend
  #   environment:
  #     DATABASE_URL: mysql+pymysql://mainthub_user:mainthub_pass@mysql:3306/mainthub_db
  #     JWT_SECRET_KEY: mainthub-jwt-secret-change-in-production
  #   ports:
  #     - "5000:5000"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy

volumes:
  mysql_data: