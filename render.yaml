# MaintHub — Render web service (database lives on Railway)
# Dashboard: New → Web Service, Root Directory = mainthub-backend
# Set DATABASE_URL manually to your Railway public connection string.

services:
  - type: web
    name: mainthub-backend
    runtime: python
    plan: free
    rootDir: mainthub-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste Railway public URL in Render dashboard
