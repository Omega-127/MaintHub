# Render Blueprint — use with Root Directory = mainthub-backend
# (Dashboard: New → Blueprint, or Web Service with that root.)
# For monorepo Blueprint from repo root, move this file up one level
# and add: rootDir: mainthub-backend

databases:
  - name: mainthub-db
    plan: free
    databaseName: mainthub_db
    user: mainthub

services:
  - type: web
    name: mainthub-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mainthub-db
          property: connectionString
